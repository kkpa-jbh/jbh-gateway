# Image: tests jbh-gateway, then builds its Docker image for two CPU types (amd64 and arm64)
# and pushes both to GHCR (GitHub Container Registry) under ONE tag.
#
# When it runs: after each merge into main, or by hand.
# What it changes: the GHCR package ghcr.io/kkpa-jbh/jbh-gateway. It deploys nothing.
# Each image gets the git SHA tag (one fixed version).
# It also gets "latest", but only when its commit is still the newest on main.
# The deploy (jbh-deploy repo) pulls the image by its SHA tag. The VPS never builds it.
#
# Jobs, in order:
# 1. package - runs the tests and builds the jar once (the jar does not depend on the CPU type).
# 2. image   - calls the reusable workflow jbh-deploy/.github/workflows/multi-arch-image.yml. It builds
#              "Build image (amd64)" and "Build image (arm64)" on native runners, publishes one tag for both,
#              and keeps the 10 newest tagged images. One file in jbh-deploy serves all 5 service repos.
#
# More: jbh-deploy/CI.md ("Image" and "Multi-arch image").

# The name shown in the GitHub "Actions" tab.
name: Image

on:
  # Adds a "Run workflow" button in the Actions tab, to build an image by hand.
  workflow_dispatch:
  # Runs on every push to main. A merged PR is a push to main, so this runs after each merge.
  push:
    branches: [ main ]

# The automatic GITHUB_TOKEN gets no permission at the top. Each job asks only for what it needs.
permissions: {}

# One run at a time for the whole repo. GitHub does not promise the order of waiting runs,
# so the reusable workflow moves "latest" only for the newest commit on main.
# - group: the workflow name only, not the branch. A run started by hand on another branch waits too.
#   Otherwise its cleanup could delete the untagged digests of a run that has not tagged them yet.
# - queue: max -> every waiting run stays in the queue (up to 100). The default (single) cancels a waiting run
#   when a newer one arrives, and that commit would never get its image.
# - cancel-in-progress: false -> a running build is never stopped halfway (that could leave pushed digests with no tag).
concurrency:
  group: ${{ github.workflow }}
  queue: max
  cancel-in-progress: false

jobs:
  # Runs the tests and builds the Spring Boot jar once. Machine: a GitHub-hosted Ubuntu VM, deleted after the run.
  # The jar is plain Java bytecode, so the same file goes into the amd64 and the arm64 image.
  package:
    name: Test and build the app package
    runs-on: ubuntu-latest
    # The tests (no Docker needed) plus the build take about 4 minutes. 20 leaves room for a cold cache.
    timeout-minutes: 20
    permissions:
      # Download the code. Nothing else.
      contents: read
    steps:
      # The VM starts empty. This step downloads the code of the pushed commit into it.
      # Actions are pinned to a full commit SHA (the version is in the comment), so a moved tag cannot change them.
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Installs Java 21 (Temurin build). Gradle needs it to compile the Kotlin code.
      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      # Sets up Gradle and caches its files between runs,
      # so Gradle does not download every dependency again each time.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Runs all tests, also the Kubernetes guard tests (routing without Consul, probes without a token).
      # A failed test stops the run: no image is built.
      # --no-daemon: no Gradle background process. The VM is deleted after the run anyway.
      - name: Run the tests
        run: ./gradlew --no-daemon test

      # Builds the runnable Spring Boot jar in build/libs/. The Dockerfile copies this jar.
      - name: Build the boot jar
        run: ./gradlew --no-daemon bootJar

      # Hands the jar to the image jobs (each job runs on its own VM, so files do not carry over).
      # *-SNAPSHOT.jar is the Boot jar; the *-plain.jar next to it is not runnable.
      # retention-days: 1 -> the artifact is only needed during this run.
      - name: Upload the app package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-package
          path: build/libs/*-SNAPSHOT.jar
          retention-days: 1

  # Builds, tags and cleans the image, through the reusable workflow in jbh-deploy.
  # needs: package -> it waits for the tested jar (the artifact "app-package").
  # Pinned to a jbh-deploy commit SHA, like an action: a change there reaches this repo only when you bump the SHA.
  # In the Actions tab its jobs show as "Build and publish the image / Build image (amd64)", and so on.
  image:
    name: Build and publish the image
    needs: package
    # The most the called jobs may use: read the code, push and delete images in GHCR.
    permissions:
      contents: read
      packages: write
    uses: kkpa-jbh/jbh-deploy/.github/workflows/multi-arch-image.yml@8e2034e55480624e869863dbced9d10f04eb799c # JBH-86
    with:
      image: ghcr.io/kkpa-jbh/jbh-gateway
      package-name: jbh-gateway
      # The repo root holds the Dockerfile.
      context: .
      # The Dockerfile copies build/libs/*-SNAPSHOT.jar.
      app-package-path: build/libs
