# Builds the jbh-gateway image and pushes it to GHCR, tagged with the git SHA.
name: Image

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build boot jar
        run: ./gradlew --no-daemon bootJar

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # One version per push. Build attestations would add untagged versions that fill the keep-5 window.
          provenance: false
          tags: |
            ghcr.io/kkpa-jbh/jbh-gateway:${{ github.sha }}
            ghcr.io/kkpa-jbh/jbh-gateway:latest

      # GitHub Free: 500 MB for private packages. Keep the 2 newest images: the running one and one to roll back to.
      - name: Delete old images
        uses: actions/delete-package-versions@v5
        with:
          package-name: jbh-gateway
          package-type: container
          min-versions-to-keep: 2
