spring:
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        instanceId: ${spring.application.name}:${random.value}
        healthCheckPath: /actuator/health
        healthCheckInterval: 60s
        preferIpAddress: false
        service-name: API Gateway

    gateway:
      routes:
        - id: auth_api_route
          uri: lb://jbh-iam-service
          predicates:
            - Path=/jbh-api/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@inMemoryRateLimiter}"
                key-resolver: "#{@ipKeyResolver}"

        - id: users_api_route
          uri: lb://jbh-iam-service
          predicates:
            - Path=/jbh-api/users/**
          filters:
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@inMemoryRateLimiter}"
                key-resolver: "#{@ipKeyResolver}"

        - id: personal_finance_api_route
          uri: lb://jbh-personal-finance
          predicates:
            - Path=/jbh-api/accounts/**,/jbh-api/products/**
          filters:
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@inMemoryRateLimiter}"
                key-resolver: "#{@ipKeyResolver}"

        - id: notifications_api_route
          uri: lb://jbh-personal-finance
          predicates:
            - Path=/jbh-api/notifications/**
          filters:
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@inMemoryRateLimiter}"
                key-resolver: "#{@ipKeyResolver}"

  application:
    name: jbh-gateway

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway

jwt:
  secret: ${JWT_SECRET:p7YH4n3B6GZC6FvJBHm9a0YzqkXyZP8vJBH1F0sYB7Q=}
  token-type-claim: token_type
  access-token-type: ACCESS


logging:
    level:
      com.kkpa.jbh_gateway.filter: DEBUG

