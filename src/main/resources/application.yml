spring:
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        instanceId: ${spring.application.name}:${random.value}
        healthCheckPath: /actuator/health
        healthCheckInterval: 60s
        preferIpAddress: false
        # Name registered in Consul. In Docker it must be the compose service name (jbh-gateway).
        hostname: ${CONSUL_DISCOVERY_HOSTNAME:localhost}
        service-name: API Gateway

    gateway:
      routes:
        # Before auth_api_route: the first matching route wins. Stricter limit against password guessing.
        - id: auth_login_route
          uri: lb://jbh-iam-service
          predicates:
            - Path=/jbh-api/auth/signin,/jbh-api/auth/signup,/jbh-api/auth/google
          filters:
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@authRateLimiter}"
                key-resolver: "#{@ipKeyResolver}"

        - id: auth_api_route
          uri: lb://jbh-iam-service
          predicates:
            - Path=/jbh-api/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@inMemoryRateLimiter}"
                key-resolver: "#{@ipKeyResolver}"

        - id: users_api_route
          uri: lb://jbh-iam-service
          predicates:
            - Path=/jbh-api/users/**,/jbh-api/user-groups/**
          filters:
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@inMemoryRateLimiter}"
                key-resolver: "#{@ipKeyResolver}"

        - id: personal_finance_api_route
          uri: lb://jbh-personal-finance
          predicates:
            - Path=/jbh-api/finance/**,/jbh-api/products/**,/jbh-api/preferences/**
          filters:
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@inMemoryRateLimiter}"
                key-resolver: "#{@ipKeyResolver}"

        - id: notifications_api_route
          uri: lb://jbh-personal-finance
          predicates:
            - Path=/jbh-api/notifications/**
          filters:
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@inMemoryRateLimiter}"
                key-resolver: "#{@ipKeyResolver}"

  application:
    name: jbh-gateway

server:
  port: ${JBH_GATEWAY_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

jbh:
  rate-limit:
    # Comma-separated CIDRs allowed to set X-Forwarded-For (production: the Docker network "edge").
    trusted-proxies: ${JBH_TRUSTED_PROXIES:}

jwt:
  # Required, no default: Base64, at least 32 bytes. Same value as jbh-iam.
  secret: ${JWT_SECRET}
  token-type-claim: token_type
  access-token-type: ACCESS


